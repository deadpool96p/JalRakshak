[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bodmer/TFT_eSPI@^2.5.43
    spaziochirale/Chirale_TensorFLowLite@^2.0.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_MISO=19
    -D TFT_CS=5
    -D TFT_DC=17
    -D TFT_RST=16
    -D TOUCH_CS=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_TOUCH_FREQUENCY=1000000
